openapi: 3.0.3
info:
  title: Stockio Allocation Controller API
  version: 1.0.0
  description: |
    OpenAPI description of the endpoints implemented by AllocationController.
    No application-level authentication is configured.
paths:
  /api/allocation/jobs:
    post:
      tags:
        - Allocation
      operationId: submitAllocationJob
      summary: Submit an allocation request
      description: |
        Validates that `asOfDate` is the current business date and submits the
        request for processing. `requestId` is the logical allocation
        idempotency key; each asynchronous submission receives its own `jobId`.

        By default, `async=true` publishes the raw `AllocationRequest` JSON to
        the configured Kafka topic, keyed by a unique execution `jobId`, and
        returns after Kafka acknowledges the publish. Job tracking starts when the
        Kafka listener takes the record, so the job id is not pollable until then.
        Kafka consumption is separately opt-in. With `async=false`, processing runs inline but the
        endpoint still returns `202 Accepted`. The current inline branch uses
        the allocation run ID as `jobId` without creating a JobRunr job, so the
        returned `Location` is not a valid job-status polling URL for that
        branch.
        When opt-in allocation admission is enabled, configured request-shape
        limits apply before publishing or execution. Inline execution can be
        rejected with 503 before allocation writes; asynchronous submission does
        not reserve an execution permit or bound topic backlog.
      parameters:
        - name: async
          in: query
          required: false
          description: Publish the request to Kafka for background processing. Defaults to true.
          schema:
            type: boolean
            default: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllocationRequest'
      responses:
        '202':
          description: Request accepted; for `async=true`, Kafka acknowledged the publish.
          headers:
            Location:
              description: Relative URL for querying the job status. Not pollable when `async=false`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllocationJobAccepted'
        '400':
          description: The request is invalid, exceeds configured count limits, or `asOfDate` is not the current business date.
        '413':
          description: The request exceeds the enabled allocation byte limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdmissionErrorResponse'
        '503':
          description: Inline allocation capacity is exhausted; this attempt made no allocation writes. Retry unchanged later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdmissionErrorResponse'
        '500':
          description: Kafka publish failed or its acknowledgement outcome is unknown, or an unexpected server error occurred.

  /api/allocation/jobs/{jobId}:
    get:
      tags:
        - Allocation
      operationId: getAllocationJobStatus
      summary: Get allocation job status
      description: |
        Returns the current JobRunr state when a JobRunr job exists, otherwise
        the durable Kafka submission/execution state. A completed job includes
        its saved allocation result; other states have a null result. A
        succeeded job without a saved completion is reported as a server
        consistency error.
      parameters:
        - name: jobId
          in: path
          required: true
          description: Execution ID returned by asynchronous submission.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current job state and its completion result, when available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllocationJobStatus'
        '400':
          description: The supplied job ID is not a valid UUID.
        '404':
          description: No JobRunr job or Kafka tracking record exists for this ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: The job succeeded but its saved completion is missing or unreadable.

  /api/allocation/stock-ledger/status:
    get:
      tags:
        - Allocation
      operationId: getAllocationStockLedgerStatus
      summary: Get stock-ledger synchronization status
      description: |
        Returns the latest committed ledger synchronization and freshness
        information. This is an additional status mapping on AllocationController.
      responses:
        '200':
          description: Ledger synchronization status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockLedgerSyncStatus'
        '500':
          description: An unexpected server error occurred while loading status.

components:
  schemas:
    AdmissionErrorResponse:
      type: object
      required:
        - code
        - error
      properties:
        code:
          type: string
          enum:
            - ALLOCATION_CAPACITY_EXHAUSTED
            - ALLOCATION_REQUEST_TOO_LARGE
        error:
          type: string

    AllocationRequest:
      type: object
      required:
        - requestId
        - asOfDate
        - runType
      properties:
        requestId:
          type: string
          format: uuid
          description: Logical request identity used for allocation idempotency.
        asOfDate:
          type: string
          format: date
          description: Must equal the current business date for this endpoint.
        runType:
          $ref: '#/components/schemas/AllocationRunType'
        demandOrders:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/DemandOrder'
        inboundShipments:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/InboundShipment'

    AllocationRunType:
      type: string
      enum:
        - NEW_DEMAND
        - BACKORDER_FULFILLMENT

    DemandOrder:
      type: object
      required:
        - orderId
        - customer
        - priority
        - placedDate
        - lines
      properties:
        orderId:
          type: string
          maxLength: 100
          minLength: 1
          pattern: '\S'
        customer:
          type: string
          minLength: 1
          pattern: '\S'
        priority:
          type: integer
          format: int32
          minimum: 1
        placedDate:
          type: string
          format: date
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DemandOrderLine'

    DemandOrderLine:
      type: object
      required:
        - orderLineId
        - sku
        - requestedQuantity
        - requiredDeliveryDate
      properties:
        orderLineId:
          type: string
          maxLength: 100
          minLength: 1
          pattern: '\S'
        sku:
          type: string
          maxLength: 64
          minLength: 1
          pattern: '\S'
        requestedQuantity:
          type: integer
          format: int32
          minimum: 1
        requiredDeliveryDate:
          type: string
          format: date

    InboundShipment:
      type: object
      required:
        - shipmentId
        - lines
      properties:
        shipmentId:
          type: string
          maxLength: 100
          minLength: 1
          pattern: '\S'
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/InboundShipmentLine'

    InboundShipmentLine:
      type: object
      required:
        - shipmentLineId
        - sku
        - expectedQuantity
        - expectedArrivalDate
      properties:
        shipmentLineId:
          type: string
          maxLength: 100
          minLength: 1
          pattern: '\S'
        sku:
          type: string
          maxLength: 64
          minLength: 1
          pattern: '\S'
        expectedQuantity:
          type: integer
          format: int32
          minimum: 1
        expectedArrivalDate:
          type: string
          format: date
        warehouseCode:
          type: string
          maxLength: 50
          minLength: 1
          pattern: '\S'
          default: MAIN

    AllocationJobAccepted:
      type: object
      required:
        - jobId
        - requestId
      properties:
        jobId:
          type: string
          format: uuid
          description: Execution ID used for asynchronous requests.
        requestId:
          type: string
          format: uuid

    AllocationJobStatus:
      type: object
      required:
        - jobId
        - status
        - result
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          description: Current JobRunr state or Kafka tracking state (PROCESSING, SUCCEEDED, or FAILED). Absent until a worker takes the record.
        result:
          type: object
          allOf:
            - $ref: '#/components/schemas/AllocationCompletionResult'
          nullable: true

    AllocationCompletionResult:
      type: object
      required:
        - jobId
        - allocationRun
      properties:
        jobId:
          type: string
          format: uuid
        allocationRun:
          $ref: '#/components/schemas/AllocationRunResult'

    AllocationRunResult:
      type: object
      required:
        - runId
        - requestId
        - runType
        - asOfDate
        - createdAt
        - openBackorderCount
        - allocations
      properties:
        runId:
          type: string
          format: uuid
        requestId:
          type: string
          format: uuid
        runType:
          $ref: '#/components/schemas/AllocationRunType'
        asOfDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
        openBackorderCount:
          type: integer
          format: int32
          minimum: 0
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/AllocationRecord'

    AllocationRecord:
      type: object
      required:
        - orderId
        - customer
        - sku
        - priority
        - placedDate
        - requiredDeliveryDate
        - requestedQuantity
        - allocatedFromInventory
        - allocatedFromInbound
        - backorderedQuantity
        - status
        - sources
        - orderLineId
        - processingOutcome
      properties:
        orderId:
          type: string
        customer:
          type: string
        sku:
          type: string
        priority:
          type: integer
          format: int32
        placedDate:
          type: string
          format: date
        requiredDeliveryDate:
          type: string
          format: date
        requestedQuantity:
          type: integer
          format: int32
        allocatedFromInventory:
          type: integer
          format: int32
        allocatedFromInbound:
          type: integer
          format: int32
        backorderedQuantity:
          type: integer
          format: int32
        status:
          type: string
          allOf:
            - $ref: '#/components/schemas/AllocationStatus'
          nullable: true
        sources:
          type: array
          items:
            $ref: '#/components/schemas/AllocationSource'
        orderLineId:
          type: string
        processingOutcome:
          $ref: '#/components/schemas/AllocationProcessingOutcome'

    AllocationStatus:
      type: string
      enum:
        - ALLOCATED
        - PARTIALLY_BACKORDERED
        - BACKORDERED
        - PARTIALLY_FULFILLED
        - FULFILLED

    AllocationProcessingOutcome:
      type: string
      enum:
        - PROCESSED
        - SKIPPED_ORDER_EXPIRED

    AllocationSource:
      type: object
      required:
        - sourceType
        - sourceId
        - quantity
        - sourceDate
        - warehouseLocation
        - shipmentId
        - shipmentLineId
      properties:
        sourceType:
          $ref: '#/components/schemas/AllocationSourceType'
        sourceId:
          type: string
        quantity:
          type: integer
          format: int32
        sourceDate:
          type: string
          format: date
        warehouseLocation:
          type: string
          nullable: true
        shipmentId:
          type: string
          nullable: true
        shipmentLineId:
          type: string
          nullable: true

    AllocationSourceType:
      type: string
      enum:
        - INVENTORY
        - INBOUND

    StockLedgerSyncStatus:
      type: object
      required:
        - schedulingEnabled
        - lastSuccessAt
        - snapshotDate
        - skuCount
        - lotSnapshotCount
        - nextExpectedAt
        - staleAfter
        - stale
      properties:
        schedulingEnabled:
          type: boolean
        lastSuccessAt:
          type: string
          format: date-time
          nullable: true
        snapshotDate:
          type: string
          format: date
          nullable: true
        skuCount:
          type: integer
          format: int32
          nullable: true
        lotSnapshotCount:
          type: integer
          format: int32
          nullable: true
        nextExpectedAt:
          type: string
          format: date-time
        staleAfter:
          type: string
          format: date-time
        stale:
          type: boolean
        progress:
          allOf:
            - $ref: '#/components/schemas/StockLedgerProgress'
          nullable: true

    StockLedgerProgress:
      type: object
      description: Durable progress of the latest frozen per-SKU ledger manifest; only full completion advances lastSuccessAt.
      required: [runId, snapshotDate, status, totalSkus, completedSkus, createdAt]
      properties:
        runId:
          type: string
          format: uuid
        snapshotDate:
          type: string
          format: date
        status:
          type: string
          enum: [RUNNING, PARTIAL, COMPLETED, SUPERSEDED]
        totalSkus:
          type: integer
        completedSkus:
          type: integer
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        leaseUntil:
          type: string
          format: date-time
          nullable: true
        lastError:
          type: string
          nullable: true

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
