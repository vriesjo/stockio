spring:
  application:
    name: stockio-api
  main:
    web-application-type: servlet
    banner-mode: off

server:
  address: ${API_SERVER_ADDRESS:127.0.0.1}
  port: ${API_SERVER_PORT:8082}

stockio:
  mcp:
    server:
      enabled: ${STOCKIO_MCP_SERVER_ENABLED:true}
      jar-path: ${STOCKIO_MCP_SERVER_JAR:/Users/vriesjo/Development/Home/stockio/stockio-service/build/libs/stockio-service-0.0.1-SNAPSHOT.jar}
      java-command: ${STOCKIO_MCP_JAVA_COMMAND:java}
      request-timeout: ${STOCKIO_MCP_REQUEST_TIMEOUT:60s}
      initialization-timeout: ${STOCKIO_MCP_INITIALIZATION_TIMEOUT:60s}
