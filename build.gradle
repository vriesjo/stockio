plugins {
    id 'java'
    id 'org.springframework.boot' apply false
    id 'io.spring.dependency-management' apply false
    id 'org.jetbrains.kotlin.jvm' version '2.2.20' apply false
    id 'org.jetbrains.kotlin.plugin.spring' version '2.2.20' apply false
    id 'org.jetbrains.kotlin.plugin.jpa' version '2.2.20' apply false
    id 'org.openapi.generator' version '7.26.0' apply false
}

ext {
    set('springAiVersion', "1.1.2")
}

allprojects {
    repositories {
        mavenCentral()
        maven { url 'https://packages.confluent.io/maven/' }
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'org.jetbrains.kotlin.jvm'
    apply plugin: 'org.jetbrains.kotlin.plugin.spring'
    apply plugin: 'org.jetbrains.kotlin.plugin.jpa'

    kotlin {
        jvmToolchain(21)
    }

    ext['kotlin.version'] = kotlin.coreLibrariesVersion

    dependencies {
        implementation 'org.jetbrains.kotlin:kotlin-reflect'
        implementation 'com.fasterxml.jackson.module:jackson-module-kotlin'
    }

    dependencyManagement {
        imports {
            mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
            mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(Test) {
        useJUnitPlatform()
    }
}

project(":stockio-api") {
    apply plugin: 'org.openapi.generator'

    def allocationOpenApiSpec = rootProject.file(
        'stockio-api/src/main/resources/openapi/allocation-controller.yaml'
    )
    def generatedAllocationOpenApiDir = layout.buildDirectory.dir('generated/openapi/allocation')

    tasks.register(
        'openApiGenerateAllocation',
        org.openapitools.generator.gradle.plugin.tasks.GenerateTask
    ) {
        generatorName.set('kotlin-spring')
        inputSpec.set(allocationOpenApiSpec)
        outputDir.set(generatedAllocationOpenApiDir.get())
        apiPackage.set('nl.stockio.allocation.domain.api.generated')
        modelPackage.set('nl.stockio.allocation.domain.api.generated.model')
        importMappings.set([
            AllocationRequest: 'nl.stockio.api.dto.AllocationRequest',
            AllocationRunType: 'nl.stockio.api.dto.AllocationRunType',
            DemandOrder: 'nl.stockio.api.dto.DemandOrder',
            DemandOrderLine: 'nl.stockio.api.dto.DemandOrderLine',
            InboundShipment: 'nl.stockio.api.dto.InboundShipment',
            InboundShipmentLine: 'nl.stockio.api.dto.InboundShipmentLine',
            AllocationJobAccepted: 'nl.stockio.api.dto.AllocationJobAccepted',
            AllocationJobStatus: 'nl.stockio.api.dto.AllocationJobStatus',
            AllocationCompletionResult: 'nl.stockio.api.dto.AllocationCompletionResult',
            AllocationRunResult: 'nl.stockio.api.dto.AllocationRunResult',
            AllocationRecord: 'nl.stockio.api.dto.AllocationRecord',
            AllocationStatus: 'nl.stockio.api.dto.AllocationStatus',
            AllocationProcessingOutcome: 'nl.stockio.api.dto.AllocationProcessingOutcome',
            AllocationSource: 'nl.stockio.api.dto.AllocationSource',
            AllocationSourceType: 'nl.stockio.api.dto.AllocationSourceType',
            StockLedgerSyncStatus: 'nl.stockio.stock.domain.service.StockLedgerSyncStatus',
            AdmissionErrorResponse: 'kotlin.collections.Map',
            ErrorResponse: 'kotlin.collections.Map'
        ])
        globalProperties.set([
            apis: '',
            models: 'false'
        ])
        cleanupOutput.set(true)
        configOptions.set([
            interfaceOnly: 'true',
            useSpringBoot3: 'true',
            useBeanValidation: 'true',
            useResponseEntity: 'true',
            skipDefaultInterface: 'true',
            useTags: 'true',
            annotationLibrary: 'none',
            documentationProvider: 'none',
            generateJsonIncludeAnnotations: 'false',
            generateJsonSetterNullsAnnotations: 'false',
            reactive: 'true'
        ])
    }

    openApiValidate {
        inputSpec.set(allocationOpenApiSpec)
    }

    def reservationOpenApiSpec = rootProject.file(
        'stockio-api/src/main/resources/openapi/reservation-controller.yaml'
    )
    def generatedReservationOpenApiDir = layout.buildDirectory.dir('generated/openapi/reservation')

    tasks.register(
        'openApiGenerateReservation',
        org.openapitools.generator.gradle.plugin.tasks.GenerateTask
    ) {
        generatorName.set('kotlin-spring')
        inputSpec.set(reservationOpenApiSpec)
        outputDir.set(generatedReservationOpenApiDir.get())
        apiPackage.set('nl.stockio.reservation.domain.api.generated')
        modelPackage.set('nl.stockio.reservation.domain.api.generated.model')
        importMappings.set([
            OrderReservationResponse: 'nl.stockio.api.dto.OrderReservationResponse',
            OrderReservationLine: 'nl.stockio.api.dto.OrderReservationLine',
            OrderReservationStatus: 'nl.stockio.api.dto.OrderReservationStatus',
            RedisKeyResponse: 'nl.stockio.api.dto.RedisKeyResponse'
        ])
        globalProperties.set([
            apis: '',
            models: 'false'
        ])
        cleanupOutput.set(true)
        configOptions.set([
            interfaceOnly: 'true',
            useSpringBoot3: 'true',
            useBeanValidation: 'true',
            useResponseEntity: 'true',
            skipDefaultInterface: 'true',
            useTags: 'true',
            annotationLibrary: 'none',
            documentationProvider: 'none',
            generateJsonIncludeAnnotations: 'false',
            generateJsonSetterNullsAnnotations: 'false',
            reactive: 'true'
        ])
    }

    tasks.register(
        'openApiValidateReservation',
        org.openapitools.generator.gradle.plugin.tasks.ValidateTask
    ) {
        inputSpec.set(reservationOpenApiSpec)
    }

    def productAllocationOpenApiSpec = rootProject.file(
        'stockio-api/src/main/resources/openapi/product-allocation-controller.yaml'
    )
    def generatedProductAllocationOpenApiDir = layout.buildDirectory.dir(
        'generated/openapi/product-allocation'
    )

    tasks.register(
        'openApiGenerateProductAllocation',
        org.openapitools.generator.gradle.plugin.tasks.GenerateTask
    ) {
        generatorName.set('kotlin-spring')
        inputSpec.set(productAllocationOpenApiSpec)
        outputDir.set(generatedProductAllocationOpenApiDir.get())
        apiPackage.set('nl.stockio.product.domain.api.generated')
        modelPackage.set('nl.stockio.product.domain.api.generated.model')
        importMappings.set([
            ProductAllocationRequest: 'nl.stockio.api.dto.ProductAllocationRequest',
            ProductAllocationResponse: 'nl.stockio.api.dto.ProductAllocationResponse',
            ProductAllocationStatus: 'nl.stockio.api.dto.ProductAllocationStatus',
            ResolvedProduct: 'nl.stockio.api.dto.ResolvedProduct',
            ProductCandidate: 'nl.stockio.api.dto.ProductCandidate',
            ProductSource: 'nl.stockio.api.dto.ProductSource',
            AllocationRunResult: 'nl.stockio.api.dto.AllocationRunResult',
            AdmissionErrorResponse: 'kotlin.collections.Map',
            ErrorResponse: 'kotlin.collections.Map'
        ])
        globalProperties.set([
            apis: '',
            models: 'false'
        ])
        cleanupOutput.set(true)
        configOptions.set([
            interfaceOnly: 'true',
            useSpringBoot3: 'true',
            useBeanValidation: 'true',
            useResponseEntity: 'true',
            skipDefaultInterface: 'true',
            useTags: 'true',
            annotationLibrary: 'none',
            documentationProvider: 'none',
            generateJsonIncludeAnnotations: 'false',
            generateJsonSetterNullsAnnotations: 'false',
            reactive: 'true'
        ])
    }

    tasks.register(
        'openApiValidateProductAllocation',
        org.openapitools.generator.gradle.plugin.tasks.ValidateTask
    ) {
        inputSpec.set(productAllocationOpenApiSpec)
    }
}

project(":stockio-service") {
    apply plugin: 'org.springframework.boot'
    group = 'nl.stockio'
    version = '0.0.1-SNAPSHOT'

    springBoot {
        mainClass = 'nl.stockio.StockioApplicationKt'
    }

    def generatedAllocationOpenApiDir = project(":stockio-api").layout.buildDirectory.dir(
        'generated/openapi/allocation'
    )

    def generatedReservationOpenApiDir = project(":stockio-api").layout.buildDirectory.dir(
        'generated/openapi/reservation'
    )
    def generatedProductAllocationOpenApiDir = project(":stockio-api").layout.buildDirectory.dir(
        'generated/openapi/product-allocation'
    )
    sourceSets {
        main {
            kotlin.srcDir(generatedAllocationOpenApiDir.map { it.dir('src/main/kotlin') })
            kotlin.srcDir(generatedReservationOpenApiDir.map { it.dir('src/main/kotlin') })
            kotlin.srcDir(generatedProductAllocationOpenApiDir.map { it.dir('src/main/kotlin') })
        }
    }

    tasks.named('compileKotlin') {
        dependsOn(project(":stockio-api").tasks.named('openApiGenerateAllocation'))
        dependsOn(project(":stockio-api").tasks.named('openApiGenerateReservation'))
        dependsOn(project(":stockio-api").tasks.named('openApiGenerateProductAllocation'))
    }

    dependencies {
        implementation project(":stockio-api")
        implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webflux'
        implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core'
        implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-reactor'
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        implementation 'org.springframework.boot:spring-boot-starter-webflux'
        implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:2.8.13'
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
        implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
        implementation 'org.postgresql:r2dbc-postgresql'
        implementation 'org.springframework.boot:spring-boot-starter-amqp'
        implementation 'org.springframework.kafka:spring-kafka'
        implementation 'io.confluent:kafka-json-schema-serializer:7.4.0'
        implementation 'org.springframework.boot:spring-boot-starter-data-redis'
        implementation 'org.springframework.boot:spring-boot-starter-validation'
        implementation 'org.jobrunr:jobrunr-spring-boot-3-starter:9.0.1'
        implementation 'io.github.oshai:kotlin-logging-jvm:8.0.4'
        implementation 'org.flywaydb:flyway-core'
        implementation 'org.flywaydb:flyway-database-postgresql'
        implementation 'org.apache.poi:poi-ooxml:5.4.1'

        runtimeOnly 'org.postgresql:postgresql'
        testImplementation('org.springframework.boot:spring-boot-starter-test') {
            exclude group: 'com.vaadin.external.google', module: 'android-json'
        }
        testImplementation 'org.springframework.kafka:spring-kafka-test'
        testImplementation 'io.kotest:kotest-assertions-core:5.9.1'
        testImplementation 'io.mockk:mockk:1.14.6'
        testImplementation 'org.testcontainers:junit-jupiter'
        testImplementation 'org.testcontainers:postgresql'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

}

project(":stockio-api") {
    group = 'nl.stockio.client'
    version = '0.0.1-SNAPSHOT'

    dependencies {
        implementation 'jakarta.validation:jakarta.validation-api'
    }
}

project(":stockio-test-harness") {
    apply plugin: 'org.springframework.boot'
    group = 'nl.stockio.test'
    version = '0.0.1-SNAPSHOT'

    springBoot {
        mainClass = 'nl.stockio.harness.publisher.AllocationPublisherApplicationKt'
    }

    sourceSets {
        main {
            kotlin.setSrcDirs(['publisher/src/main/kotlin'])
            resources.setSrcDirs(['publisher/src/main/resources'])
        }
        test {
            kotlin.setSrcDirs(['publisher/src/test/kotlin'])
        }
        performance {
            kotlin.setSrcDirs(['performance/src/main/kotlin'])
            resources.setSrcDirs(['performance/src/main/resources'])
            compileClasspath += sourceSets.main.output
            runtimeClasspath += output + compileClasspath
        }
    }

    dependencies {
        implementation project(":stockio-api")
        implementation 'org.springframework.boot:spring-boot-starter-amqp'
        implementation 'org.springframework.kafka:spring-kafka'
        implementation 'io.confluent:kafka-json-schema-serializer:7.4.0'
        implementation 'org.springframework.boot:spring-boot-starter-jdbc'
        implementation 'org.springframework.boot:spring-boot-starter-json'
        implementation 'io.github.oshai:kotlin-logging-jvm:8.0.4'
        runtimeOnly 'org.postgresql:postgresql'

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation 'org.testcontainers:junit-jupiter'
        testImplementation 'org.testcontainers:postgresql'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

        performanceImplementation project(":stockio-api")
        performanceImplementation 'io.gatling:gatling-core-java:3.13.5'
        performanceImplementation 'io.gatling:gatling-http-java:3.13.5'
        performanceImplementation 'com.fasterxml.jackson.module:jackson-module-kotlin'
        performanceImplementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
        performanceRuntimeOnly 'io.gatling:gatling-app:3.13.5'
        performanceRuntimeOnly 'io.gatling.highcharts:gatling-charts-highcharts:3.13.5'
    }

    tasks.register('performanceRun', JavaExec) {
        group = 'verification'
        description = 'Run the allocation job performance simulation with Gatling.'
        dependsOn('performanceClasses')
        classpath = sourceSets.performance.runtimeClasspath
        mainClass = 'io.gatling.app.Gatling'
        jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED'
        systemProperties.putAll(
            System.getProperties().findAll { key, _ -> key.toString().startsWith('stockio.perf.') }
        )
        args '-s', 'nl.stockio.harness.performance.AllocationJobSimulation',
            '-rf', "${layout.buildDirectory.get().asFile}/reports/gatling",
            '-rd', "allocation-job-performance"
    }
}
