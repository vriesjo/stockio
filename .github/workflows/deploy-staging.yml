name: Deploy to Staging

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggering

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  NODE_VERSION: '20'
  AWS_REGION: 'us-east-1'
  ECR_REPOSITORY_SERVICE: 'itzitzo-auth-gateway-service'
  ECR_REPOSITORY_UI: 'itzitzo-auth-gateway-ui'
  ECS_CLUSTER: 'itzitzo-auth-gateway-staging'
  ECS_SERVICE_SERVICE: 'auth-gateway-service-staging'
  ECS_SERVICE_UI: 'auth-gateway-ui-staging'
  ENVIRONMENT: 'staging'

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    environment: 
      name: staging
      url: https://staging.itzitzo-auth-gateway.example.com
    permissions:
      contents: read
      id-token: write  # For AWS OIDC (if using)
    
    outputs:
      service-image: ${{ steps.image-tags.outputs.service-image }}
      ui-image: ${{ steps.image-tags.outputs.ui-image }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'gradle'
          
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'ui/package.json'
          
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        
      - name: Set image tags
        id: image-tags
        run: |
          echo "service-image=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_SERVICE }}:staging-${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "ui-image=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_UI }}:staging-${{ github.sha }}" >> $GITHUB_OUTPUT
          
      - name: Build service Docker image
        run: |
          ./gradlew :service:bootBuildImage \
            --imageName=${{ steps.image-tags.outputs.service-image }} \
            --no-daemon \
            --stacktrace
            
      - name: Build UI Docker image
        run: |
          ./gradlew :ui:bootBuildImage \
            --imageName=${{ steps.image-tags.outputs.ui-image }} \
            --no-daemon \
            --stacktrace
            
      - name: Tag and push service image
        run: |
          docker tag ${{ steps.image-tags.outputs.service-image }} \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_SERVICE }}:staging-latest
          docker push ${{ steps.image-tags.outputs.service-image }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_SERVICE }}:staging-latest
          
      - name: Tag and push UI image
        run: |
          docker tag ${{ steps.image-tags.outputs.ui-image }} \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_UI }}:staging-latest
          docker push ${{ steps.image-tags.outputs.ui-image }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_UI }}:staging-latest
          
      - name: Scan service image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ${{ steps.image-tags.outputs.service-image }}
          format: 'table'
          exit-code: '0'
          
      - name: Scan UI image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ${{ steps.image-tags.outputs.ui-image }}
          format: 'table'
          exit-code: '0'

  deploy-service:
    name: Deploy Service to ECS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging
    permissions:
      contents: read
      id-token: write  # For AWS OIDC (if using)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: Download service task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_SERVICE_SERVICE }} \
            --query taskDefinition > task-definition-service.json
            
      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def-service
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition-service.json
          container-name: auth-gateway-service
          image: ${{ needs.build-and-push.outputs.service-image }}
          
      - name: Deploy service to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def-service.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 10

  deploy-ui:
    name: Deploy UI to ECS
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-service]
    environment: staging
    permissions:
      contents: read
      id-token: write  # For AWS OIDC (if using)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: Download UI task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_SERVICE_UI }} \
            --query taskDefinition > task-definition-ui.json
            
      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def-ui
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition-ui.json
          container-name: auth-gateway-ui
          image: ${{ needs.build-and-push.outputs.ui-image }}
          
      - name: Deploy UI to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def-ui.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_UI }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 10

  verify-deployment:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: [deploy-service, deploy-ui]
    permissions:
      contents: read
    
    steps:
      - name: Health check - Service
        run: |
          echo "Checking service health..."
          # Add your health check URL here
          # curl -f https://staging-service.itzitzo-auth-gateway.example.com/actuator/health || exit 1
          echo "Service health check would be performed here"
          
      - name: Health check - UI
        run: |
          echo "Checking UI health..."
          # Add your health check URL here
          # curl -f https://staging.itzitzo-auth-gateway.example.com/actuator/health || exit 1
          echo "UI health check would be performed here"
          
      - name: Deployment summary
        run: |
          echo "## Staging Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Deployment completed successfully!**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** Staging" >> $GITHUB_STEP_SUMMARY
          echo "- **Service Image:** ${{ needs.build-and-push.outputs.service-image }}" >> $GITHUB_STEP_SUMMARY
          echo "- **UI Image:** ${{ needs.build-and-push.outputs.ui-image }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [deploy-service, deploy-ui]
    if: failure()
    environment: staging
    permissions:
      contents: read
      id-token: write  # For AWS OIDC (if using)
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: Rollback service
        run: |
          echo "Rolling back service to previous version..."
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE_SERVICE }} \
            --force-new-deployment
            
      - name: Rollback UI
        run: |
          echo "Rolling back UI to previous version..."
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE_UI }} \
            --force-new-deployment
            
      - name: Notify rollback
        run: |
          echo "## ⚠️ Staging Deployment Failed - Rollback Initiated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The deployment to staging failed and a rollback has been initiated." >> $GITHUB_STEP_SUMMARY
          echo "Please check the logs for more details." >> $GITHUB_STEP_SUMMARY
