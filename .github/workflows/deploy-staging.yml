name: Deploy to Staging

# ECS is not ready. This workflow does not deploy.
on:
  workflow_dispatch:

jobs:
  not-ready:
    name: ECS deployment is not ready
    runs-on: ubuntu-latest

    steps:
      - name: Skip ECS deployment
        run: |
          echo "ECS deployment is not ready. No image was pushed and no ECS service was updated."
          {
            echo "## Staging"
            echo
            echo "ECS deployment is not ready. This workflow did not deploy."
          } >> "$GITHUB_STEP_SUMMARY"
