spring:
  server:
    port: ${PORT:9091}
  config:
    import: optional:file:.env.test.harness[.properties]
  application:
    name: stockio-test-harness-publisher
  main:
    web-application-type: none
    banner-mode: off
  datasource:
    url: ${HARNESS_DB_URL:jdbc:postgresql://localhost:5437/logistics}
    username: ${HARNESS_DB_USERNAME:logistics}
    password: ${HARNESS_DB_PASSWORD:logistics}
    hikari:
      pool-name: HarnessCataloguePool
      read-only: true
      maximum-pool-size: 2
      minimum-idle: 0
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:stockio}
    password: ${RABBITMQ_PASSWORD:stockio}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

stockio:
  harness:
    zone: ${ALLOCATION_LEDGER_SYNC_ZONE:UTC}
  allocation:
    rabbitmq:
      exchange: ${ALLOCATION_RABBITMQ_EXCHANGE:stockio.allocation.exchange}
      routing-key: ${ALLOCATION_RABBITMQ_ROUTING_KEY:allocation.request}
      publisher:
        enabled: ${ALLOCATION_RABBITMQ_PUBLISHER_ENABLED:false}
        interval: ${ALLOCATION_RABBITMQ_PUBLISHER_INTERVAL:1000}
    kafka:
      topic: ${ALLOCATION_KAFKA_TOPIC:stockio.allocation.requests}
      publisher:
        enabled: ${ALLOCATION_KAFKA_PUBLISHER_ENABLED:false}
        interval: ${ALLOCATION_KAFKA_PUBLISHER_INTERVAL:1000}
