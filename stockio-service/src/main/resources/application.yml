spring:
  server:
    port: ${PORT:9090}
  application:
    name: stockio-service
  main:
    web-application-type: servlet
    banner-mode: off
  ai:
    mcp:
      server:
        type: sync
        name: mcp-server
        version: 0.0.1

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5437/logistics}
    username: ${DB_USERNAME:logistics}
    password: ${DB_PASSWORD:logistics}
    hikari:
      pool-name: StockioHikariPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:stockio}
    password: ${RABBITMQ_PASSWORD:stockio}
    listener:
      simple:
        default-requeue-rejected: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      auto-create: false
    consumer:
      group-id: ${ALLOCATION_KAFKA_GROUP_ID:stockio-allocation}
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 1
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

jobrunr:
  background-job-server:
    enabled: true
  dashboard:
    enabled: true
    port: ${JOBRUNR_DASHBOARD_PORT:8181}

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:9090}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never

stockio:
  product:
    repository:
      type: jpa
  product-resolution:
    tavily-api-key: ${TAVILY_API_KEY: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}
    tavily-base-url: ${TAVILY_BASE_URL:https://api.tavily.com}
    ollama-base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    embedding-model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    request-timeout: ${PRODUCT_RESOLUTION_TIMEOUT:15s}
    max-results: ${PRODUCT_RESOLUTION_MAX_RESULTS:5}
    max-candidates: ${PRODUCT_RESOLUTION_MAX_CANDIDATES:5}
    minimum-similarity: ${PRODUCT_RESOLUTION_MINIMUM_SIMILARITY:0.72}
    minimum-similarity-gap: ${PRODUCT_RESOLUTION_MINIMUM_SIMILARITY_GAP:0.04}
    minimum-local-similarity: ${PRODUCT_RESOLUTION_MINIMUM_LOCAL_SIMILARITY:0.90}
    minimum-local-similarity-gap: ${PRODUCT_RESOLUTION_MINIMUM_LOCAL_SIMILARITY_GAP:0.08}
    minimum-tavily-evidence-similarity: ${PRODUCT_RESOLUTION_MINIMUM_TAVILY_EVIDENCE_SIMILARITY:0.25}
  stock:
    repository:
      type: jpa
    ledger-sync:
      enabled: ${ALLOCATION_LEDGER_SYNC_ENABLED:true}
      cron: ${ALLOCATION_LEDGER_SYNC_CRON:0 0,12 * * *}
      zone: ${ALLOCATION_LEDGER_SYNC_ZONE:UTC}
      freshness-tolerance: ${ALLOCATION_LEDGER_SYNC_FRESHNESS_TOLERANCE:1h}
  reservation:
    repository:
      type: jpa
    ttl: ${ALLOCATION_RESERVATION_TTL:30m}
    expiry-interval: ${ALLOCATION_RESERVATION_EXPIRY_INTERVAL:1m}
    expiry-batch-size: ${ALLOCATION_RESERVATION_EXPIRY_BATCH_SIZE:100}
  allocation:
    repository:
      type: jpa
    csv-path: ${ALLOCATION_CSV_PATH:docs/allocations.csv}
    max-concurrent-skus: ${ALLOCATION_MAX_CONCURRENT_SKUS:4}
    admission:
      enabled: ${ALLOCATION_ADMISSION_ENABLED:false}
      max-in-flight: ${ALLOCATION_ADMISSION_MAX_IN_FLIGHT:0}
      max-orders: ${ALLOCATION_ADMISSION_MAX_ORDERS:0}
      max-shipments: ${ALLOCATION_ADMISSION_MAX_SHIPMENTS:0}
      max-demand-lines: ${ALLOCATION_ADMISSION_MAX_DEMAND_LINES:0}
      max-inbound-lines: ${ALLOCATION_ADMISSION_MAX_INBOUND_LINES:0}
      max-distinct-skus: ${ALLOCATION_ADMISSION_MAX_DISTINCT_SKUS:0}
      max-request-bytes: ${ALLOCATION_ADMISSION_MAX_REQUEST_BYTES:0}
    rabbitmq:
      exchange: ${ALLOCATION_RABBITMQ_EXCHANGE:stockio.allocation.exchange}
      routing-key: ${ALLOCATION_RABBITMQ_ROUTING_KEY:allocation.request}
      request-queue: ${ALLOCATION_RABBITMQ_REQUEST_QUEUE:stockio.allocation.requests}
      dead-letter-exchange: ${ALLOCATION_RABBITMQ_DEAD_LETTER_EXCHANGE:stockio.allocation.dlx}
      dead-letter-routing-key: ${ALLOCATION_RABBITMQ_DEAD_LETTER_ROUTING_KEY:allocation.failed}
      dead-letter-queue: ${ALLOCATION_RABBITMQ_DEAD_LETTER_QUEUE:stockio.allocation.dead}
    kafka:
      enabled: ${ALLOCATION_KAFKA_ENABLED:false}
      topic: ${ALLOCATION_KAFKA_TOPIC:stockio.allocation.requests}
      group-id: ${ALLOCATION_KAFKA_GROUP_ID:stockio-allocation}
      dead-letter-topic: ${ALLOCATION_KAFKA_DEAD_LETTER_TOPIC:stockio.allocation.requests.DLT}
      partition-count: ${ALLOCATION_KAFKA_PARTITION_COUNT:4}
      listener-concurrency: ${ALLOCATION_KAFKA_LISTENER_CONCURRENCY:2}
      worker-count: ${ALLOCATION_KAFKA_WORKER_COUNT:2}
      channel-capacity: ${ALLOCATION_KAFKA_CHANNEL_CAPACITY:4}
      capacity-backoff-min: ${ALLOCATION_KAFKA_CAPACITY_BACKOFF_MIN:5s}
      capacity-backoff-max: ${ALLOCATION_KAFKA_CAPACITY_BACKOFF_MAX:10s}
      retry-backoff: ${ALLOCATION_KAFKA_RETRY_BACKOFF:1s}
      retry-attempts: ${ALLOCATION_KAFKA_RETRY_ATTEMPTS:3}

  report:
    directory: ${REPORT_DIR:${user.home}/itzitzo-mcp/reports}

logging:
  level:
    root: INFO

# Enables native JSON console logging (e.g., Logstash or ECS format)
  structured:
    format:
      console: logstash

springdoc:
  swagger-ui:
    path: /openapi.html
    disable-swagger-default-url: true
    urls:
      - name: Allocation API
        url: /openapi/allocation-controller.yaml
      - name: Product Allocation API
        url: /openapi/product-allocation-controller.yaml
      - name: Reservation API
        url: /openapi/reservation-controller.yaml
