spring:
  application:
    name: mcp
  main:
    web-application-type: servlet
    banner-mode: off
  ai:
    mcp:
      server:
        type: sync
        name: mcp-server
        version: 0.0.1

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5436/logistics}
    username: ${DB_USERNAME:logistics}
    password: ${DB_PASSWORD:logistics}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:stockio}
    password: ${RABBITMQ_PASSWORD:stockio}
    listener:
      simple:
        default-requeue-rejected: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

jobrunr:
  background-job-server:
    enabled: true
  dashboard:
    enabled: true
    port: ${JOBRUNR_DASHBOARD_PORT:8181}

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

stockio:
  allocation:
    csv-path: ${ALLOCATION_CSV_PATH:docs/allocations.csv}
    rabbitmq:
      exchange: ${ALLOCATION_RABBITMQ_EXCHANGE:stockio.allocation.exchange}
      routing-key: ${ALLOCATION_RABBITMQ_ROUTING_KEY:allocation.request}
      request-queue: ${ALLOCATION_RABBITMQ_REQUEST_QUEUE:stockio.allocation.requests}
      dead-letter-exchange: ${ALLOCATION_RABBITMQ_DEAD_LETTER_EXCHANGE:stockio.allocation.dlx}
      dead-letter-routing-key: ${ALLOCATION_RABBITMQ_DEAD_LETTER_ROUTING_KEY:allocation.failed}
      dead-letter-queue: ${ALLOCATION_RABBITMQ_DEAD_LETTER_QUEUE:stockio.allocation.dead}
      publisher:
        enabled: ${ALLOCATION_RABBITMQ_PUBLISHER_ENABLED:true}
        interval: ${ALLOCATION_RABBITMQ_PUBLISHER_INTERVAL:1000}
  report:
    directory: ${REPORT_DIR:${user.home}/itzitzo-mcp/reports}

logging:
  level:
    root: INFO

# Enables native JSON console logging (e.g., Logstash or ECS format)
  structured:
    format:
      console: logstash
