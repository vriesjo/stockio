spring:
  application:
    name: mcp
  main:
    web-application-type: servlet
    banner-mode: off
  ai:
    mcp:
      server:
        type: sync
        name: mcp-server
        version: 0.0.1

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5436/logistics}
    username: ${DB_USERNAME:logistics}
    password: ${DB_PASSWORD:logistics}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

jobrunr:
  background-job-server:
    enabled: true

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

logistics:
  allocation:
    csv-path: ${ALLOCATION_CSV_PATH:docs/allocations.csv}
  report:
    directory: ${REPORT_DIR:${user.home}/itzitzo-mcp/reports}

logging:
  level:
    root: INFO
