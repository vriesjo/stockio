services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: logistics
      POSTGRES_USER: logistics
      POSTGRES_PASSWORD: ${DB_PASSWORD:-logistics}
    ports:
      - "5436:5432"
    volumes:
      - logistics-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logistics -d logistics"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  logistics-postgres:
